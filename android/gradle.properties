org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.caching=true
android.useAndroidX=true
# Jetifier OFF: the app already uses AndroidX. Enabling it forces a
# JetifyTransform on the Flutter native-lib JARs which OOMs the GHA runner
# (Java heap space in mergeReleaseNativeLibs). Disabling removes that step.
android.enableJetifier=false
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

