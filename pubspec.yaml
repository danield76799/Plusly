dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  msix: ^3.16.7
  # test: ^1.25.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
    - family: Twemoji Mozilla
      fonts:
        - asset: assets/font/Twemoji.v0.7.0.ttf

msix_config:
  display_name: Plusly
  publisher_display_name: Plusly
  publisher: CN=Daan, O=Plusly, L=Laren, S=NH, C=NL
  identity_name: com.danield.plusly
  logo_path: assets\logo.png
  capabilities: internetClient, location, microphone, webcam
  protocol_activation: https
  app_uri_handler_hosts: plusly.im, matrix.to
  execution_alias: plusly
  sign_msix: false
  install_certificate: false
